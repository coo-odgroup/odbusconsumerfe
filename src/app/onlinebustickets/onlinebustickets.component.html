<section class="bus-ticket-page">

    <!-- Header -->
    <section class="page-header">
        <div class="container">

            <div class="breadcrumb">
                <a routerLink="/">Home</a>
                <span>›</span>
                <span>{{ pageTitle }}</span>
            </div>

            <h1>{{ pageTitle }}</h1>

        </div>
    </section>

    <!-- Search -->
    <!-- Desktop & Tablet -->
    <section class="search-wrapper d-none d-md-block">
        <app-search-box></app-search-box>
    </section>

    <!-- Mobile -->
    <section class="d-block d-md-none">
        <app-search-box-m></app-search-box-m>
    </section>

    <!-- Content -->
    <section class="content-wrapper">

        <div class="container">

            <div class="content-card">

                <div class="section-block" [innerHTML]="pageContent"></div>

            </div>

        </div>

    </section>

</section>
