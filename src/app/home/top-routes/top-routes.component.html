<section class="top-routs fluid-15" *ngIf="popularRoutes?.length > 0">
  <div class="container">
    <div class="row align-items-center mb-3">
      <div class="col-md-6">
        <h3 class="title-section">Popular Routes</h3>
      </div>
      <div class="col-md-6 text-right">
        <a routerLink="/routes" class="btn btn-warning">All Routes</a>
      </div>
    </div>
  </div>
  <div class="container">
    <div class="row" [class.show-all]="showAllRoutes">
      <div
        class="col-md-4 col-sm-6 route-item"
        *ngFor="let p of popularRoutes; let i = index; trackBy: trackByRoute"
        [class.extra-route]="i >= 5"
      >
        <a class="route-card" [routerLink]="routeLink(p)">
          <div class="route-left">
            <img
              src="assets/img/Icon-metro-location.svg"
              width="16"
              height="26"
              class="route-icon"
              alt=""
              loading="lazy"
            />
            <div class="route-text">
              <span class="city">{{ p?.source }}</span>
              <span class="exchange">→</span>
              <span class="city">{{ p?.destination }}</span>
            </div>
          </div>
        </a>
      </div>

      <div class="col-md-12 text-center view-all-wrap" *ngIf="!showAllRoutes && popularRoutes?.length > 5">
        <button type="button" (click)="viewAllRoutes()" class="border-btn bh mt-3">
          View All
        </button>
      </div>
    </div>
  </div>
</section>
