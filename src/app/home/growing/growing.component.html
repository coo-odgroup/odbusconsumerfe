<section class="stats-section">
  <div class="container">

    <h2 class="stats-title">THE NUMBERS ARE GROWING</h2>

    <div class="stats-grid">

      <div class="stat-card" *ngFor="let counter of counters; let i = index">

        <!-- ICON -->
        <div class="icon-wrap">
          <img *ngIf="i === 0" src="assets/img/routs.png">
          <img *ngIf="i === 1" src="assets/img/buses.png">
          <img *ngIf="i === 2" src="assets/img/sat-cust.png">
          <img *ngIf="i === 3" src="assets/img/support.png">
        </div>

        <!-- COUNT -->
        <h3 class="count">
          {{ getDisplay(counter) }}
        </h3>

        <!-- LABEL -->
        <p>{{ counter.label }}</p>

      </div>

    </div>

  </div>
</section>
