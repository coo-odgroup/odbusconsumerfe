<section class="whats-new-section section-offer">
  <div class="container">
    <div class="row mb-3">
      <div class="col-md-6">
        <div class="section-offer-left">
          <h2>ODBUS OFFERS</h2>
        </div>
      </div>

      <div class="col-md-6 text-right">
        <a routerLink="/offers">View All</a>
      </div>
    </div>

    <div class="slider-wrapper">
      <!-- LEFT -->
      <button
        type="button"
        class="slide-btn prev-btn"
        (click)="moveSlider(-1)"
        aria-label="Next Slide"
      >
        <i class="fa fa-angle-left" aria-hidden="true"></i>
      </button>

      <!-- Cards Row -->
      <div class="cards-scroll" id="cardsScroll">
        <div class="news-card" *ngFor="let offer of Offers">
          <img
            src="{{offer.slider_photo}}"
            alt="{{offer.alt_tag}}"
            loading="lazy"
          />
        </div>
      </div>

      <!-- RIGHT -->
      <button
        type="button"
        class="slide-btn next-btn"
        (click)="moveSlider(1)"
        aria-label="Previous Slide"
      >
        <i class="fa fa-angle-right" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</section>
